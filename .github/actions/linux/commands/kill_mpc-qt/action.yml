name: Close mpc-qt
description: "Close mpc-qt and wait for it to start then check that it's not running"

runs:
  using: "composite"

  steps:
  - name: Wait 10 seconds
    run:  sleep 10
    shell: bash
  - name: Close mpc-qt
    run: |
      echo '{ "command": "exit" }' | socat - /tmp/cmdrkotori.mpc-qt
    shell: bash
  - name: Wait 10 seconds
    run:  sleep 10
    shell: bash
  - name: Check that mpc-qt is not running
    uses: ./.github/actions/linux/commands/check_if_running
    with:
      should_be_running: "no"
