name: C/C++ CI

on:
  push:
  pull_request:

env:
  DEVBUILD: continuous

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    container:
      image: "registry.opensuse.org/home/mia/images/images/mpv-ci:stable-deps"

    steps:
    - name: Install packages
      run: |
        zypper refresh
        zypper dup -y --allow-vendor-change --allow-downgrade
        zypper install -y \
        --no-recommends \
        --allow-vendor-change \
        --allow-downgrade \
        cmake \
        boost-devel \
        Mesa-libGL-devel \
        mpv-devel \
        qt6-tools-linguist \
        qt6-linguist-devel \
        qt6-tools-devel \
        qt6-base-devel \
        qt6-svg-devel
    - uses: actions/checkout@v6.0.2
      with:
        fetch-depth: 1000
        fetch-tags: true
    - name: Set version
      run: |
        echo "FORCE_VERSION=" >> $GITHUB_ENV
        VERSION=$( cat .github/actions/data/VERSION )
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        if [ $VERSION != $DEVBUILD ]; then
            echo "FORCE_VERSION=-DMPCQT_VERSION=$( cat .github/actions/data/VERSION )" >> $GITHUB_ENV
        fi
    - name: cmake
      run: cmake $FORCE_VERSION -DCMAKE_BUILD_TYPE=RelWithDebInfo -G Ninja -B build
    - name: Build
      run: cmake --build build
    - name: Save, strip and link symbols
      run: |
        cd bin
        objcopy --only-keep-debug mpc-qt mpc-qt.dbg
        objcopy --strip-debug mpc-qt
        objcopy --add-gnu-debuglink=mpc-qt.dbg mpc-qt
    - name: Upload executable
      uses: actions/upload-artifact@v7
      with:
        name: "mpc-qt-linux-x64-${{ env.VERSION }}"
        path: bin/mpc-qt
    - name: Upload symbols file
      uses: actions/upload-artifact@v7
      with:
        name: "mpc-qt-linux-x64-debug_symbols-${{ env.VERSION }}"
        path: bin/mpc-qt.dbg

  tests:
    name: Linux
    needs: build
    uses: ./.github/workflows/linux_tests.yml

  appimage:
    name: AppImage
    needs: tests
    uses: ./.github/workflows/appimage.yml

  flatpak:
    name: Flatpak
    needs: tests
    uses: ./.github/workflows/flatpak.yml

  pre-release:
    name: Pre-release
    if: ${{ github.ref_name == 'master' && github.repository_owner == 'mpc-qt' }}
    runs-on: ubuntu-latest
    needs: [appimage, flatpak]
    env:
      GH_TOKEN: ${{ secrets.API_TOKEN_GITHUB_DEV_BUILDS }}

    steps:
    - name: Trigger dev-builds release workflow
      run: |
        gh workflow run --repo mpc-qt/dev-builds "Release maker"
