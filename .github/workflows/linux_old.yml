name: C/C++ CI

on:
  [workflow_call]

env:
  DEVBUILD: continuous

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04

    steps:
    - name: Install packages
      run: |
        sudo apt-get update
        sudo apt-get -y --no-install-recommends install \
        build-essential \
        cmake \
        libboost-stacktrace-dev \
        libgl-dev \
        libmpv-dev \
        linguist-qt6 \
        qt6-tools-dev \
        qt6-base-dev \
        libqt6svg6-dev \
    - uses: actions/checkout@v6.0.2
      with:
        fetch-depth: 1000
        fetch-tags: true
    - name: Test build
      run: |
        cmake -G Ninja -B build
        cmake --build build
